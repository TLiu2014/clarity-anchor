# ClarityAnchor reverse proxy for EC2.
# Critical bits are for SSE: no buffering + a long read timeout so the ERP pause
# (a held-open /api/agent stream) is never cut mid-countdown.
#
# Install: copy to /etc/nginx/conf.d/clarityanchor.conf, then `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SSE / streaming ---
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;   # allow long-lived agent streams (ERP pause)
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
